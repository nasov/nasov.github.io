name: Deploy Preview

on:
  # Runs on pull requests targeting any branch
  pull_request:
    types: [opened, synchronize, reopened]

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write  # Needed to comment on PR

# Allow concurrent deployments for different PRs
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true  # Cancel outdated deployments

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ github.event.number }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true  # Deploy as preview environment

      - name: Comment PR
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            const url = '${{ steps.deployment.outputs.page_url }}';
            const message = `✨ Preview deployment is ready! Visit: ${url}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
