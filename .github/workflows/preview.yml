name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "preview-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Create PR-specific subdirectory
      - name: Prepare PR-specific directory
        run: |
          PR_PATH="pr-${{ github.event.number }}"
          mkdir -p "$PR_PATH"
          cp -r public/* "$PR_PATH"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pr-${{ github.event.number }}"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment PR
        uses: actions/github-script@v7
        if: success()
        with:
          script: |
            const prPath = 'pr-${{ github.event.number }}';
            const baseUrl = '${{ steps.deployment.outputs.page_url }}';
            // Remove trailing slash if present
            const cleanBaseUrl = baseUrl.replace(/\/$/, '');
            const previewUrl = `${cleanBaseUrl}/${prPath}/`;
            const message = `✨ Preview deployment is ready! Visit: ${previewUrl}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
